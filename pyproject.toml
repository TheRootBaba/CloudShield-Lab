[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudshield-lab"
version = "0.1.0"
description = "Cloud security verification platform"
requires-python = ">=3.9"

[project.scripts]
cloudshield = "cloudshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudshield-lab"
version = "0.3.0"
description = "Local-first cloud security verification and attack-path validation lab"
requires-python = ">=3.10"
license = "MIT"
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.34,<2"]
azure = ["azure-identity>=1.25,<2", "azure-mgmt-resource>=23,<26", "azure-mgmt-monitor>=6,<8"]
cloud = ["boto3>=1.34,<2", "azure-identity>=1.25,<2", "azure-mgmt-resource>=23,<26", "azure-mgmt-monitor>=6,<8"]
firebase = ["firebase-admin==7.8.0"]
signing = ["cryptography>=50"]
dev = ["coverage>=7.6"]

[project.scripts]
cloudshield = "cloudshield.cli:main"
cloudshield-server = "cloudshield.api:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.report]
fail_under = 90
show_missing = true

name: CloudShield CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run test suite
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q src tests

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Check formatting
        run: terraform fmt -recursive -check terraform
      - name: Validate secure configuration
        working-directory: terraform/secure
        run: terraform init -backend=false -input=false && terraform validate
      - name: Validate vulnerable training fixture
        working-directory: terraform/vulnerable
        run: terraform init -backend=false -input=false && terraform validate


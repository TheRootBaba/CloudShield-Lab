[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloudshield-lab"
version = "0.2.0"
description = "Local-first cloud security verification and attack-path validation lab"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
cloudshield = "cloudshield.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
